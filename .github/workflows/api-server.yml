name: API server

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "artifacts/api-server/**"
      - "lib/api-zod/**"
      - "lib/db/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/api-server.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.0.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check API dependencies
        run: pnpm --filter @workspace/api-server run typecheck

      - name: Build API server
        run: pnpm --filter @workspace/api-server run build

      - name: Verify production entry point
        run: test -f artifacts/api-server/dist/index.mjs
