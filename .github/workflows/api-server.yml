name: API server

on:
  push:
    branches:
      - main
    paths:
      - 'artifacts/api-server/**'
      - 'lib/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/api-server.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --no-frozen-lockfile --config.minimumReleaseAge=0

      - name: Build API Server
        run: pnpm --filter @workspace/api-server build

      - name: Push Compiled Artifacts to Hostinger Branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: hostinger-production
          publish_dir: ./artifacts/api-server/dist
          force_orphan: true
          commit_message: "chore: automated build for Hostinger deployment"
