name: API server

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "artifacts/api-server/**"
      - "lib/api-zod/**"
      - "lib/db/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/api-server.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PNPM_BIN: ${{ runner.temp }}/pnpm/node_modules/.bin/pnpm

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24.x

      - name: Install pnpm
        run: |
          npm install --prefix "$RUNNER_TEMP/pnpm" pnpm@12.3.4
          "$PNPM_BIN" --version

      - name: Install dependencies
        run: "$PNPM_BIN" install --frozen-lockfile

      - name: Type-check API dependencies
        run: "$PNPM_BIN" --filter @workspace/api-server run typecheck

      - name: Build API server
        run: "$PNPM_BIN" --filter @workspace/api-server run build

      - name: Verify production entry point
        run: test -f artifacts/api-server/dist/index.mjs
