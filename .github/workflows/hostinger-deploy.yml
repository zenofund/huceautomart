name: Build and Deploy to Hostinger

on:
  push:
    branches:
      - main
    paths:
      - 'artifacts/api-server/**'
      - 'lib/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/hostinger-deploy.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.14.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build API Server
        run: pnpm --filter @workspace/api-server build

      - name: Prepare Deployment Package
        run: |
          mkdir -p deploy/dist
          cp -r artifacts/api-server/dist/* deploy/dist/
          cp artifacts/api-server/package.json deploy/
          echo 'node dist/index.mjs' > deploy/start.sh
          chmod +x deploy/start.sh

      - name: Deploy to Hostinger Branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: hostinger-production
          publish_dir: ./deploy
          force_orphan: true
          commit_message: "chore: automated build for Hostinger deployment"
