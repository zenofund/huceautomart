name: Build and Deploy to Hostinger

on:
  push:
    branches:
      - main
    paths:
      - 'artifacts/api-server/**'
      - 'lib/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/hostinger-deploy.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.17.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install Dependencies (includes dev deps for build)
        run: pnpm install --frozen-lockfile --prod=false

      - name: Build Hostinger Package
        run: pnpm run build

      - name: Deploy to Hostinger Branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: hostinger-production
          publish_dir: ./dist
          force_orphan: true
          commit_message: "chore: automated build for Hostinger deployment"
